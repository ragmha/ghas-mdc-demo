# ############################################################################
# The seeded application must not be exposed publicly.
# Use kubectl port-forward for presenter access; do not remove this boundary
# just to obtain an internet-exposure risk factor.
# ############################################################################
apiVersion: v1
kind: Service
metadata:
  name: orders-portal
  namespace: ghas-mdc-demo
  labels:
    app.kubernetes.io/name: orders-portal
    app.kubernetes.io/instance: orders-portal
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ghas-mdc-demo
    app.kubernetes.io/managed-by: github-actions
    demo.ghas-mdc/owner: platform-security
    demo.ghas-mdc/criticality: demo-high
    demo.ghas-mdc/exposure: internal
    demo.ghas-mdc/data-classification: synthetic
  annotations:
    demo.ghas-mdc/purpose: >-
      Internal-only demo access; code-to-runtime mapping does not require
      exposing the vulnerable application to the public internet.
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    demo.ghas-mdc/lifecycle: ephemeral-delete-after-demo
spec:
  type: LoadBalancer
  # Cluster-wide traffic policy keeps a single-replica demo reachable regardless
  # of which node the pod lands on.
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: SingleStack
  selector:
    app.kubernetes.io/name: orders-portal
    app.kubernetes.io/instance: orders-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
